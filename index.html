*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);font-size:13px;line-height:1.5;margin:0;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
/* v2 type scale: chrome 13px, messages 14px/160%, h1 17 h2 15 h3 13 */
.msg{font-size:14px;line-height:1.6;overflow-wrap:break-word}
.msg h1{font-size:17px;font-weight:600;margin:18px 0 10px}
.msg h2{font-size:15px;font-weight:600;margin:16px 0 8px}
.msg h3,.msg h4{font-size:13px;font-weight:500;margin:14px 0 6px;color:var(--muted)}
.msg p{margin:0 0 12px}.msg p:last-child{margin-bottom:0}
.msg a{color:var(--link);text-decoration:none}
.msg a:hover{text-decoration:underline;text-underline-offset:2px}
.msg ul,.msg ol{margin:8px 0 12px;padding-left:28px}
.msg li{margin-bottom:6px}.msg li::marker{color:var(--muted)}
.msg blockquote{border-inline-start:2px solid var(--border-strong);margin:12px 0;padding-left:10px;color:var(--muted)}
.msg table{display:block;overflow-x:auto;margin:12px 0;font-size:13px;border-collapse:collapse}
.msg th,.msg td{border-bottom:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
.msg th{font-weight:500}
.msg hr{border:none;border-top:1px solid var(--border);margin:20px 0}
/* Hermes Calm Console: prose-first transcript — assistant serif, user stays sans */
.msg.assistant .mbody{font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.65}
.msg.user{font-family:var(--sans)}
/* context ring states (ambient budget awareness) */
#ctxFill.warn{background:var(--think)}
#ctxFill.crit{background:var(--error)}
#ctxRow.ring{position:relative}
/* demand-driven inspector: closed by default on desktop */
body[data-insp="closed"] aside[data-slot="inspector"]{display:none}
/* Control Center modal */
#ccModal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#ccModal.open{display:flex}
#ccBox{background:var(--layer);border:1px solid var(--border-strong);border-radius:12px;width:min(480px,92vw);max-height:84vh;overflow:auto;animation:pop-in .12s ease-out}
#ccTabs{display:flex;gap:4px;padding:10px 12px 0}
#ccTabs button{flex:1;font-size:12px;padding:6px}
#ccTabs button.on{border-color:var(--accent-text);color:var(--accent-text)}
#ccBody{padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
#ccBody .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ccBody label{color:var(--muted);font-size:12px}
#ccBody select{font-size:12px;padding:4px;flex:1;min-width:140px}
/* titlebar tighten: model filter smaller, session context only */
#modelFilter{width:170px}
#wsPick{font-size:12px;max-width:150px}
#wsAdd{font-size:12px;padding:8px 10px}

#menuBtn{display:none}

 aside[data-slot="sessions-sidebar"]{position:fixed;left:0;top:0;bottom:0;z-index:60;width:250px;transform:translateX(-105%);transition:transform .18s ease;box-shadow:0 8px 24px rgba(0,0,0,.35)}
 body[data-side="open"] aside[data-slot="sessions-sidebar"]{transform:none}

}

.seclabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

header[data-slot="titlebar"]{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--layer);border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap}
header b{white-space:nowrap}
select,textarea,input,button{background:var(--layer-2);color:var(--text);border:1px solid var(--border-strong);border-radius:8px;padding:8px}

.sess:hover{background:var(--hover)}

.sess .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

.sess .time{font-size:11px;color:var(--faint);white-space:nowrap}

.ghead:hover{color:var(--text)}
.sess-empty{font-size:13px;color:var(--muted);padding:8px 4px}

.tagchip{font-size:10px;background:var(--accent-bg,var(--layer-2));border:1px solid var(--border-strong);border-radius:8px;padding:0 6px;margin-left:4px;cursor:pointer;white-space:nowrap}

#slashMenu{position:fixed;z-index:60;background:var(--layer-2);border:1px solid var(--border-strong);border-radius:8px;min-width:260px;max-width:90vw;max-height:300px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;animation:pop-in .12s ease-out}
.slash-it{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.slash-it.active{background:var(--hover)}
.slash-it .cmd{font-family:var(--mono);font-weight:600;white-space:nowrap}
.slash-it .desc{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v2 empty state: centered, no art, title + desc + CTA */
.empty-state{text-align:center;padding-top:52px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-state .et{font-size:13px;font-weight:500}
.empty-state .ed{font-size:13px;color:var(--muted)}
.tippill{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);background:var(--layer-2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;display:flex;gap:8px;align-items:center;z-index:20;animation:msg-in .3s ease-out}
.tippill button{border:none;background:none;color:var(--faint);padding:0 4px}
.tippill button:hover{color:var(--text)}
/* Chat panel */
main[data-slot="session-chat-panel"]{flex:2;display:flex;flex-direction:column;padding:12px;gap:10px;min-width:0;min-height:0;position:relative;overflow:hidden}
/* Inspector */
aside[data-slot="inspector"]{flex:1;border-left:1px solid var(--border);padding:12px;overflow:auto;max-width:380px;min-width:260px;background:var(--bg)}

.mgroup{padding:6px 8px 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.msg{padding:10px;border-radius:10px;max-width:88%;white-space:pre-wrap}

#sys{width:100%;height:90px;font-family:var(--mono);font-size:12px}
h4{margin:12px 0 6px}
/* ---------- motion (ported from opencode v2 packages/ui) ---------- */
@keyframes msg-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pop-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes shimmer-sweep{0%{background-position:100% 0}100%{background-position:0% 0}}
@keyframes pulse-dot{0%,100%{opacity:.4}50%{opacity:1}}
.msg{animation:msg-in .25s ease-out}
#modelList{animation:pop-in .12s ease-out;transform-origin:top left}
.tool{animation:msg-in .2s ease-out}
.tool-head .caret{transition:transform .15s ease}
.tool.open .tool-head .caret{transform:rotate(90deg)}
.sess,.mopt,button,.tool-head{transition:background .15s ease}
button{transition:background .15s ease,transform .12s ease}
button:active{transform:scale(.96)}
.copybtn{transition:opacity .15s ease}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border-strong);border-top-color:var(--accent-text);border-radius:50%;animation:spin .9s linear infinite;vertical-align:-2px;margin-right:8px}
.shimmer{background:linear-gradient(90deg,var(--muted) 40%,var(--text) 50%,var(--muted) 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer-sweep 1.2s linear infinite}
.cursor{animation:blink 1s step-end infinite;color:var(--muted)}
#status.live::before{content:"●";color:var(--accent-text);margin-right:4px;animation:pulse-dot 2s ease-in-out infinite}
/* v2 code treatment: block dark + radius + hover copy; inline pill */
.msg pre{position:relative;background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:12px 0}
.msg pre code{font-family:inherit;background:none;padding:0}
.msg pre .kw{color:var(--kw);font-weight:600}
.msg pre .num{color:var(--accent-text)}
.msg :not(pre)>code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:0 4px;border-radius:4px}
/* P2: token colors (prism-lite, dependency-free) + distinct subagent card */
.tok-k{color:var(--kw);font-weight:600}
.tok-n{color:var(--accent-text)}
.tok-s{color:#8fce8f}
.tok-c{color:var(--faint);font-style:italic}
.tok-v{color:var(--link)}
@media (prefers-color-scheme:light){.tok-s{color:#1c7a3d}}
/* P2: mermaid diagrams (lazy CDN; code fallback offline) */
.mm svg{max-width:100%;height:auto;background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;padding:8px}
.tool.sub{border-left:3px solid var(--accent-text);margin-left:14px;width:auto}
.tool.sub .fname{color:var(--accent-text)}
.copybtn{position:absolute;top:4px;right:4px;font-size:11px;padding:2px 8px;opacity:0}
.msg pre:hover .copybtn{opacity:1}
@media (hover:none){.copybtn{opacity:1}}
/* P1: per-msg meta (timestamp + retry/edit actions) + context footer */
.mmeta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:var(--faint)}
.msg.user .mmeta{color:rgba(255,255,255,.75)}
.mts{white-space:nowrap}
.mact{margin-left:auto;display:flex;gap:4px}
.mact button{font-size:11px;padding:1px 8px;border-radius:6px;opacity:0}
.msg:hover .mact button{opacity:1}
@media (hover:none){.mact button{opacity:1}}
.medit{width:100%;min-height:60px;font-family:var(--sans);font-size:13px;resize:vertical}
#ctxRow{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);padding:0 2px}
#ctxBar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;min-width:60px}
#ctxFill{height:100%;width:0%;background:var(--accent-text);transition:width .3s ease}
#ctxTxt{white-space:nowrap}
.tool-head:focus-visible,.tool-group-head:focus-visible{outline:2px solid var(--accent-text);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* workspace browser (inspector Files tab) */
#inspector{position:relative}
#inspGrip{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:5}
#inspGrip:hover{background:var(--accent-bg,var(--hover))}
#inspTabs{display:flex;gap:4px;margin-bottom:8px}
#inspTabs button{flex:1;font-size:12px;padding:6px}
#inspTabs button.on{border-color:var(--accent-text);color:var(--accent-text)}
#wsHead{display:flex;gap:6px;align-items:center;margin:4px 0}
#wsHead button{font-size:11px;padding:3px 8px}
#wsGit{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wsGit .dirty{color:var(--think)}
#wsCrumbs{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0;font-size:12px}
#wsCrumbs button{border:none;background:none;padding:2px 4px;color:var(--link);font-size:12px}
#wsCrumbs button:hover{text-decoration:underline}
#wsCrumbs span{color:var(--faint);padding:2px 0}
#wsTree .wsrow{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--mono);overflow:hidden}
#wsTree .wsrow:hover{background:var(--hover)}
#wsTree .wsrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wsTree .wskids{margin-left:12px;border-left:1px solid var(--border);padding-left:4px}
#wsPrev{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
#wsPrev pre{background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;padding:8px;overflow:auto;max-height:40vh;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
#wsPrev img{max-width:100%;border-radius:6px}
#wsPrev textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:12px}
.wsmeta{font-size:11px;color:var(--muted);margin:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wsmeta button{font-size:11px;padding:2px 8px}
/* tasks tab + checkpoints */
#prefsRow{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:12px;flex-wrap:wrap;color:var(--muted)}
#prefsRow select{font-size:12px;padding:4px}
.cronjob{border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:12px}
.cronjob .cid{font-family:var(--mono);font-weight:600}
.cronjob .csub{color:var(--muted);margin:2px 0;word-break:break-word}
.cronjob .cbtns{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.cronjob .cbtns button{font-size:11px;padding:2px 8px}
.cronjob .paused{color:var(--think);font-weight:600}
.cronrun{font-size:12px;padding:3px 6px;border-radius:6px;cursor:pointer;font-family:var(--mono)}
.cronrun:hover{background:var(--hover)}
#wsCp{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.cprow{border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:12px}
.cprow .csub{color:var(--muted);margin:2px 0;word-break:break-word}
.cprow .cbtns{display:flex;gap:4px;margin-top:4px}
.cprow .cbtns button{font-size:11px;padding:2px 8px}
.cprow pre{background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;padding:6px;overflow:auto;max-height:200px;font-size:11px;white-space:pre-wrap}
/* terminal tab + skills tab + voice */
#micBtn.rec{border-color:var(--error);color:var(--error)}
#termOut{background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;padding:8px;overflow:auto;max-height:46vh;min-height:160px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
#termRow{display:flex;gap:6px;align-items:center;margin-top:6px}
#termRow input{flex:1;font-family:var(--mono);font-size:12px}
.skillrow{padding:6px 8px;border-radius:6px;cursor:pointer}
.skillrow:hover{background:var(--hover)}
.skillrow .snm{font-family:var(--mono);font-weight:600;font-size:13px}
.skillrow .sds{color:var(--muted);font-size:12px}
#skillPrev{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
#skillPrev textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:12px}
</style></head>

<script>
// ---------- skins (accent palettes ported from nesquena/hermes-webui, MIT) ----------
function applySkin(name){
 try{
  if(name)document.documentElement.dataset.skin=name;
  else delete document.documentElement.dataset.skin;
  localStorage.setItem('formy.skin',name||'');
 }catch(e){}
}
try{
 let cur='';
 try{cur=localStorage.getItem('formy.skin')||'';}catch(e){}
 let sp=document.getElementById('skinPick');
  if(sp){sp.value=cur;sp.addEventListener('change',e=>{applySkin(e.target.value);try{document.getElementById('ccSkin').value=e.target.value;}catch(_){}});}
}catch(e){}
// ---------- session store (desktop tabs pattern, localStorage) ----------
const LS_SESS='formy.sessions.v1', LS_ACTIVE='formy.active.v1';
let sessions={}, activeId=null;
function loadStore(){
 try{sessions=JSON.parse(localStorage.getItem(LS_SESS)||'{}');}catch(e){sessions={};}
 activeId=localStorage.getItem(LS_ACTIVE);
 if(!activeId||!sessions[activeId]){activeId='s-'+Date.now();sessions[activeId]={title:'New session',history:[],model:'',updated:Date.now()};}
}
function saveStore(){
 try{localStorage.setItem(LS_SESS,JSON.stringify(sessions));localStorage.setItem(LS_ACTIVE,activeId);return;}catch(e){}
 // quota hit: sessions carry up to 200 tool logs each — trim oldest first, retry
 try{
  Object.keys(sessions).forEach(id=>{let s=sessions[id];if(s.history)s.history=s.history.slice(-20);if(s.tools)s.tools=s.tools.slice(-20);});
  localStorage.setItem(LS_SESS,JSON.stringify(sessions));localStorage.setItem(LS_ACTIVE,activeId);return;
 }catch(e2){}
 // last resort: keep only the active session so the current work still persists
 try{
  let keep={};if(sessions[activeId])keep[activeId]=sessions[activeId];
  localStorage.setItem(LS_SESS,JSON.stringify(keep));localStorage.setItem(LS_ACTIVE,activeId);
 }catch(e3){}
}
function cur(){return sessions[activeId];}
// v2 coarse relative time: Just now / Nm ago / Nh ago / Nd ago
function relTime(ts){
 let s=Math.max(0,(Date.now()-(ts||Date.now()))/1000);
 if(s<60)return 'Just now';
 if(s<3600)return Math.floor(s/60)+'m ago';
 if(s<86400)return Math.floor(s/3600)+'h ago';
 return Math.floor(s/86400)+'d ago';
}
function dayGroup(ts){
 let d=new Date(ts||Date.now()),now=new Date();
 let day=x=>x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate();
 if(day(d)===day(now))return 'Today';
 let y=new Date(now);y.setDate(now.getDate()-1);
 if(day(d)===day(y))return 'Yesterday';
 return 'Older';
}
function exportSession(id){
 let s=sessions[id];if(!s)return;
 let out='# '+(s.title||'Untitled')+'\n\n';
 (s.history||[]).forEach(h=>{out+='## '+(h.role==='user'?'User':'Assistant')+'\n\n'+h.content+'\n\n';});
 // session export includes tool logs (args + truncated result per call)
 (s.tools||[]).forEach(x=>{
  out+='### tool:'+x.tool+'\n\n```\nargs: '+JSON.stringify(x.args||{})+'\n\n'+String(x.result||'').slice(0,1000)+'\n```\n\n';
 });
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([out],{type:'text/markdown'}));
 a.download='session-'+id+'.md';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
let showArchived=false;try{showArchived=localStorage.getItem('formy.showArchived')==='1';}catch(e){}
let collapsedG={};try{collapsedG=JSON.parse(localStorage.getItem('formy.groups.v1')||'{}');}catch(e){collapsedG={};}
function parseTags(title){let tags=[];let text=String(title||'Untitled').replace(/#([\w-]+)/g,(m,t)=>{tags.push(t);return '';});text=text.replace(/\s+/g,' ').trim()||'Untitled';return{text,tags};}
function syncTitle(){try{document.title=(cur().title||'Untitled').slice(0,60)+' — formyproject agent';}catch(e){}}
function closeSessMenu(){document.querySelectorAll('#sessMenu').forEach(x=>x.remove());}
function sessMenu(btn,id){
 closeSessMenu();
 let s=sessions[id];if(!s)return;
 let m=document.createElement('div');m.id='sessMenu';
 let items=[
  [s.pinned?'Unpin ★':'Pin ★',()=>{s.pinned=!s.pinned;s.updated=Date.now();saveStore();renderSessions();}],
  [s.archived?'Unarchive':'Archive',()=>{s.archived=!s.archived;s.updated=Date.now();saveStore();renderSessions();}],
  ['Duplicate',()=>dupSession(id)],
  ['Rename',()=>{let n=prompt('Rename session (use #tag for tags)',s.title);if(n){s.title=n.slice(0,80);s.updated=Date.now();saveStore();renderSessions();}}],
  ['Export Markdown',()=>exportSession(id)],
  ['Export JSON',()=>exportJSON(id)],
  ['Delete',()=>{if(!confirm('Delete session "'+(s.title||'Untitled')+'"?'))return;delete sessions[id];if(id===activeId||!sessions[activeId]){activeId=Object.keys(sessions)[0]||('s-'+Date.now());if(!sessions[activeId])sessions[activeId]={title:'New session',history:[],model:'',updated:Date.now()};}saveStore();renderSessions();rerenderMsgs();},true],
 ];
 items.forEach(([label,fn,danger])=>{let b=document.createElement('button');b.textContent=label;if(danger)b.className='danger';b.onclick=e=>{e.stopPropagation();closeSessMenu();fn();};m.appendChild(b);});
 document.body.appendChild(m);
 let r=btn.getBoundingClientRect();
 m.style.top=Math.min(window.innerHeight-m.offsetHeight-8,r.bottom+4)+'px';
 m.style.left=Math.max(8,Math.min(window.innerWidth-180,r.left-140))+'px';
 setTimeout(()=>document.addEventListener('click',closeSessMenu,{once:true}),0);
}
function dupSession(id){
 let s=sessions[id];if(!s)return;
 let nid='s-'+Date.now();

function familyOf(t){
 if(['read','edit','write','apply_patch','extract'].includes(t))return{icon:'📄',label:'file'};
 if(['bash','process'].includes(t))return{icon:'⌨',label:'shell'};
 if(['grep','glob','lsp'].includes(t))return{icon:'🔍',label:'search'};
 if(['webfetch','websearch'].includes(t))return{icon:'🌐',label:'web'};
  if(['subagent','models','question','skill','skill_manage','todowrite','cron','memory','session_search','mcp_list_resources','mcp_read_resource'].includes(t))return{icon:'🤖',label:'agent'};
 return{icon:'🔧',label:'tool'};

function subOf(tool,args){
 try{
   if(tool==='bash')return String(args.command||'').slice(0,120);
   if(tool==='process')return String(args.action||'list')+' '+String(args.session_id||'').slice(0,60);
   if(tool==='read'||tool==='edit'||tool==='write')return String(args.filePath||args.path||'').slice(0,120);
   if(tool==='extract')return String(args.filePath||'').slice(0,120);
  if(tool==='apply_patch')return 'patch ' + String(args.patchText||'').slice(0,60).replace(/\n/g,' ');
  if(tool==='grep')return String(args.pattern||'').slice(0,100);
  if(tool==='glob')return String(args.pattern||'').slice(0,100);
  if(tool==='webfetch')return String(args.url||'').slice(0,120);
  if(tool==='websearch')return String(args.query||'').slice(0,120);
   if(tool==='subagent')return String(args.description||args.prompt||'').slice(0,120);
   if(tool==='skill_manage')return String(args.action||'list')+' '+String(args.name||'').slice(0,100);
   if(tool==='cron')return String(args.action||'list')+' '+String(args.schedule||args.job_id||'').slice(0,100);
   if(tool==='memory')return String(args.action||'list')+' '+String(args.target||'').slice(0,100);
   if(tool==='session_search')return String(args.query||'').slice(0,120);
  return JSON.stringify(args).slice(0,120);
 }catch(e){return '';}

// ---------- pinned scroll-follow (hermes-webui pattern: only follow when
// the user is already at the bottom; otherwise show a jump button) ----------
let _pinned=true;
function msgsEl(){return document.getElementById('msgs');}
function bottomDist(){let el=msgsEl();return el?el.scrollHeight-el.scrollTop-el.clientHeight:0;}
function scrollToBottom(){let el=msgsEl();if(!el)return;_pinned=true;el.scrollTop=el.scrollHeight;requestAnimationFrame(()=>{if(_pinned)el.scrollTop=el.scrollHeight;});syncJump();}
function scrollIfPinned(){if(_pinned)scrollToBottom();else syncJump(true);}
// mutate DOM without shifting content under a user who scrolled up to read:
// preserve distance-from-bottom across inserts/re-renders above the viewport
function stableMutate(fn){let el=msgsEl();if(!el||_pinned){fn();return;}let dist=el.scrollHeight-el.scrollTop;fn();el.scrollTop=Math.max(0,el.scrollHeight-dist);}
function syncJump(newmsg){
 let b=document.getElementById('jumpBtn');if(!b)return;
 // no layout reads here — runs on every scroll/flush; row offset is set by autogrow
 if(_pinned){b.classList.remove('show');return;}
 b.classList.add('show');b.classList.toggle('newmsg',!!newmsg);
 b.textContent=newmsg?'↓ new messages':'↓';
}
function ensureToolGroup(label){
 let box=msgsEl(),g=window._toolGroup;
 if(!g||!document.contains(g)||g.dataset.done){
   g=document.createElement('div');g.className='tool-group collapsed';
   let head=document.createElement('div');head.className='tool-group-head';
   let caret=document.createElement('span');caret.className='caret';caret.textContent='▶';
  let lab=document.createElement('span');lab.className='glabel';lab.textContent=label||'Activity';
  let cnt=document.createElement('span');cnt.className='cnt';cnt.textContent='';
  head.appendChild(caret);head.appendChild(lab);head.appendChild(cnt);headAttrs(head);
  head.onclick=()=>{let c=g.classList.toggle('collapsed');caret.textContent=c?'▶':'▼';};
  let body=document.createElement('div');body.className='tool-group-body';
  g.appendChild(head);g.appendChild(body);box.appendChild(g);
  window._toolGroup=g;
 }
 return g;
}

// ---------- lightweight markdown (v2 markdown.css treatment, no deps) ----------
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inline(s){
 s=esc(s);
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 s=s.replace(/(^|\W)\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/workspace:\/\/([^\s<>\]\)"']+)/g,'<a href="#" data-ws="$1">$1</a>');
  return s;
}

let termId=null,termOff=0,termTimer=null,termHist=[],termHi=-1;
function termStat(t){try{document.getElementById('termStat').textContent=t;}catch(e){}}
function stopTermTimer(){if(termTimer){clearInterval(termTimer);termTimer=null;}}
function ansi2html(s){
 s=String(s).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
 s=s.replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g,'');
 s=s.replace(/\x1b[()][0-9A-Z]/g,'');
 s=s.replace(/[\x00-\x08\x0b\x0c\x0e-\x1a\x1c-\x1f\x7f]/g,'');
 const F={30:'#8a93a3',31:'#e06c75',32:'#7fd07f',33:'#e3b341',34:'#9dbefe',35:'#c792ea',36:'#56c2d6',37:'#e6e6e6',90:'#6b7280',91:'#ff7b85',92:'#98e698',93:'#f0c674',94:'#aecbfa',95:'#d7aefb',96:'#7fe3f0',97:'#ffffff'};
 const B={40:'#2a2e38',41:'#e06c75',42:'#7fd07f',43:'#e3b341',44:'#9dbefe',45:'#c792ea',46:'#56c2d6',47:'#e6e6e6',100:'#3a3f4c',101:'#ff7b85',102:'#98e698',103:'#f0c674',104:'#aecbfa',105:'#d7aefb',106:'#7fe3f0',107:'#ffffff'};
 let fg=null,bg=null,bold=false,out='';
 let style=()=>{let st='';if(fg)st+='color:'+fg+';';if(bg)st+='background:'+bg+';';if(bold)st+='font-weight:700;';return st;};
 s.split(/(\x1b\[[0-9;]*m)/g).forEach(seg=>{
  let m=/^\x1b\[([0-9;]*)m$/.exec(seg);
  if(!m){let st=style();out+=st?'<span style="'+st+'">'+esc(seg)+'</span>':esc(seg);return;}
  (m[1]===''?'0':m[1]).split(';').forEach(c=>{
   c=parseInt(c||'0');
   if(c===0){fg=null;bg=null;bold=false;}
   else if(c===1)bold=true;
   else if(c===22)bold=false;
   else if(F[c])fg=F[c];
   else if(c===39)fg=null;
   else if(B[c])bg=B[c];
   else if(c===49)bg=null;
  });
 });
 return out;
}
async function termPoll(){
 if(!termId)return;
 try{
  let j=await (await wsFetch('/api/term?poll='+encodeURIComponent(termId)+'&offset='+termOff)).json();
  if(!j.ok){termStat('dead — New to restart');termId=null;stopTermTimer();return;}
  if(j.text){
   let el=document.getElementById('termOut');
   let near=(el.scrollHeight-el.scrollTop-el.clientHeight)<60;
   let div=document.createElement('div');div.innerHTML=ansi2html(j.text);el.appendChild(div);
   while(el.children.length>500)el.removeChild(el.firstChild);
   if(near)el.scrollTop=el.scrollHeight;
  }
  termOff=j.total;
  termStat((j.alive?'live':'exited — New to restart')+' · '+termId);
  if(!j.alive)stopTermTimer();
 }catch(e){}
}
function termStartTimer(){stopTermTimer();termTimer=setInterval(termPoll,1000);}

  termStat('live · '+termId);termStartTimer();termPoll();
  document.getElementById('termIn').focus();
 }catch(e){termStat('ERROR: '+e.message);}
};
document.getElementById('termKill').onclick=async()=>{
 if(!termId)return;
 try{await wsFetch('/api/term',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'kill',id:termId})});}catch(e){}
 termId=null;stopTermTimer();termStat('no terminal');
};
document.getElementById('termIn').addEventListener('keydown',e=>{
 if(e.key==='Enter'){e.preventDefault();let v=e.target.value;termHist.push(v);termHi=termHist.length;e.target.value='';termSend(v+'\n');}
 else if(e.key==='ArrowUp'){e.preventDefault();if(termHist.length){termHi=Math.max(0,termHi-1);e.target.value=termHist[termHi]||'';}}
 else if(e.key==='ArrowDown'){e.preventDefault();if(termHist.length){termHi=Math.min(termHist.length,termHi+1);e.target.value=termHist[termHi]||'';}}
 else if(e.key==='c'&&e.ctrlKey){e.preventDefault();termSend('\x03');}
 else if(e.key==='d'&&e.ctrlKey&&!e.target.value){e.preventDefault();termSend('\x04');}
});
// ---------- skills panel (same skills/ dir the agent writes) ----------
async function skillRefresh(){
 let box=document.getElementById('skillList');if(!box)return;
 let q=((document.getElementById('skillSearch')||{}).value||'').toLowerCase();
 box.textContent='…';
 try{
  let j=await (await wsFetch('/api/files?path=skills')).json();
  if(!j.ok){
   // skills/ doesn't exist yet — not an error
   box.textContent='No skills yet — + New, or let the agent save one via chat.';
   if(j.error&&!/not a directory|not a file/.test(j.error))throw new Error(j.error);
   return;
  }
  let dirs=(j.entries||[]).filter(e=>e.type==='dir');
  let items=[];
  for(let d of dirs){
   let desc='';
   try{
    let f=await (await wsFetch('/api/file?path='+encodeURIComponent('skills/'+d.name+'/SKILL.md'))).json();
    if(f.ok&&!f.binary){for(let ln of f.text.split('\n')){ln=ln.trim().replace(/^#+\s*/,'');if(ln){desc=ln.slice(0,120);break;}}}
   }catch(e){}
   if(q&&(d.name+' '+desc).toLowerCase().includes(q))items.push({name:d.name,desc});
   else if(!q)items.push({name:d.name,desc});
  }
  box.innerHTML='';
  if(!items.length){box.textContent=q?'No match.':'No skills yet — + New, or let the agent save one via chat.';return;}
  items.forEach(it=>{
   let d=document.createElement('div');d.className='skillrow';
   let n=document.createElement('div');n.className='snm';n.textContent=it.name;
   let s=document.createElement('div');s.className='sds';s.textContent=it.desc||'—';
   d.appendChild(n);d.appendChild(s);
   d.onclick=()=>skillPreview(it.name);
   box.appendChild(d);
  });
 }catch(e){box.textContent='ERROR: '+e.message;}
}
async function skillPreview(name){
 let box=document.getElementById('skillPrev');box.innerHTML='…';
 try{
  let j=await (await wsFetch('/api/file?path='+encodeURIComponent('skills/'+name+'/SKILL.md'))).json();
  if(!j.ok||j.binary)throw new Error(j.error||'read failed');
  box.innerHTML='';
  let meta=document.createElement('div');meta.className='wsmeta';
  let nm=document.createElement('span');nm.textContent=name;meta.appendChild(nm);
  let div=document.createElement('div');div.className='msg assistant';div.innerHTML=md(j.text);
  box.appendChild(meta);box.appendChild(div);
  let eb=document.createElement('button');eb.textContent='Edit';
  eb.onclick=()=>{
   box.querySelectorAll('.msg').forEach(x=>x.remove());
   let ta=document.createElement('textarea');ta.value=j.text;box.appendChild(ta);ta.focus();
   let row=document.createElement('div');row.className='wsmeta';box.appendChild(row);
   let sv=document.createElement('button');sv.textContent='Save';
   sv.onclick=async()=>{
    try{
     let r=await (await wsFetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'skills/'+name+'/SKILL.md',content:ta.value})})).json();
     if(!r.ok)throw new Error(r.error||'save failed');
     skillPreview(name);skillRefresh();
    }catch(e){alert('Save failed: '+e.message);}
   };
   let cx=document.createElement('button');cx.textContent='Cancel';cx.style.marginLeft='6px';
   cx.onclick=()=>skillPreview(name);
   row.appendChild(sv);row.appendChild(cx);
  };
  let del=document.createElement('button');del.textContent='Delete';
  del.onclick=async()=>{
   if(!confirm('Delete skill "'+name+'"?'))return;
   try{
    let r=await (await wsFetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'skills/'+name})})).json();
    if(!r.ok)throw new Error(r.error||'delete failed');
    box.innerHTML='';skillRefresh();
   }catch(e){alert('Delete failed: '+e.message);}
  };
  meta.appendChild(eb);meta.appendChild(del);
 }catch(e){box.textContent='ERROR: '+e.message;}
}
document.getElementById('skillNew').onclick=async()=>{
 let n=prompt('Skill name (lowercase, dashes)');
 if(!n)return;
 n=n.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
 if(!n){alert('Bad name.');return;}
 try{
  let r=await (await wsFetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'skills/'+n+'/SKILL.md',content:'# '+n+'\n\nOne-line description of when to use this.\n\n## Instructions\n\nSteps for the agent to follow.\n'})})).json();
  if(!r.ok)throw new Error(r.error||'create failed');
  document.getElementById('skillSearch').value='';
  skillRefresh();skillPreview(n);
 }catch(e){alert('Create failed: '+e.message);}
};
document.getElementById('skillSearch').addEventListener('input',()=>{try{skillRefresh();}catch(e){}});
init();
</script>
